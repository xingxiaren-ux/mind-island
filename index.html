  else if(st.storm>0){const ix2=k==="T"?0:k==="G"?1:2,a=(st.fy||0)+Math.PI+(ix2-1)*.9+(st.role==="T"?0:.4),tx=pl.x+Math.sin(a)*1.9,tz=pl.z+Math.cos(a)*1.9,nx=g.position.x+(tx-g.position.x)*.07,nz=g.position.z+(tz-g.position.z)*.07;if(ok(nx,nz)){g.position.x=nx;g.position.z=nz}g.position.y=gy(g.position.x,g.position.z)+(mv?Math.abs(Math.sin(t*10+ix2))*.2:.03);g.rotation.y=st.fy||0}
  else{const h=HOME[k];g.position.set(h[0],hAt(h[0],h[1])+Math.sin(t*2+k.charCodeAt(0))*.03+.03,h[1]);g.rotation.y=Math.atan2(cam.position.x-h[0],cam.position.z-h[1])}
  g.userData.ring.visible=on;if(g.userData.cloud)g.userData.cloud.position.y=(st.hat?3.9:3.1)+Math.sin(t*1.6)*.1}
 // 相機跟隨
 if(st.follow)Gl.tg.set(pl.x,gy(pl.x,pl.z)+1.2,pl.z);
 for(const k of["t","p","d"])C[k]+=(Gl[k]-C[k])*.08;C.tg.lerp(Gl.tg,.12);
 cam.position.set(C.tg.x+C.d*Math.sin(C.p)*Math.cos(C.t),C.tg.y+C.d*Math.cos(C.p),C.tg.z+C.d*Math.sin(C.p)*Math.sin(C.t));cam.lookAt(C.tg);
 // 靠近區域與村民
 let zi=-1;Z.forEach((z,i)=>{if(Math.hypot(pl.x-z.p[0],pl.z-z.p[1])<(z.k==="mtn"?10:5.6))zi=i});
 if(zi!==st.cur&&st.panel!=="npc"){st.cur=zi;if(zi>=0)openZone(zi);else if(st.panel==="zone"){sheet.style.display="none";st.panel=""}}
 let ni=-1,nd=3.4;NP.forEach((n,i)=>{const d=Math.hypot(n.g.position.x-pl.x,n.g.position.z-pl.z);if(d<nd){nd=d;ni=i}});st.near=ni;
 act.style.display=ni>=0&&st.panel!=="npc"?"block":"none";if(ni>=0)act.textContent="💬 與"+NPD[ni].n+"說話（E）";
 if(st.panel==="npc"){const i=NP.findIndex(n=>n.talk);if(i>=0&&Math.hypot(NP[i].g.position.x-pl.x,NP[i].g.position.z-pl.z)>6){NP[i].talk=false;sheet.style.display="none";st.panel=""}}
 // 動畫
 flame.scale.set(1,.85+Math.sin(t*14)*.15,1);fire.intensity*=.9+Math.random()*.2;
 clouds.forEach((c,i)=>{const dn=st.done.has(i);c.visible=c.scale.x>.02;c.scale.setScalar(dn?Math.max(0,c.scale.x-dt*1.2):1);c.position.y=hAt(...Z[i].p)+4.2+Math.sin(t+i)*.15;badges[i].visible=dn;badges[i].rotation.y=t*2});
 ANIM.forEach(fn=>fn(t,dt));
 Z.forEach((z,i)=>{v.set(z.p[0],hAt(...z.p)+2.4,z.p[1]).project(cam);const e=tags[i];if(v.z<1){e.style.display="block";e.style.left=(v.x*.5+.5)*innerWidth+"px";e.style.top=(-v.y*.5+.5)*innerHeight+"px";e.className="tag z"+(i===st.cur?" on":"");e.lastChild.textContent=st.done.has(i)?" 🏅":""}else e.style.display="none"});
 ren.render(scene,cam)}
loop();
$("#go").onclick=()=>{$("#load").style.opacity=0;setTimeout(()=>$("#load").remove(),700);C.d=80;Gl.d=18;st.follow=true;const h=$("#hint");h.style.opacity=1;setTimeout(()=>h.style.opacity=0,9000);setTimeout(()=>toast("⛵ 歡迎來到橋樑港！<br>🧭 第一個任務：前往【情緒灣】，標記你現在的心情"),900)};

// ===== 關閉鍵（X）：面板、提示、事件列、開場畫面 =====
function closeSheet(){sheet.style.display="none";if(st.panel==="npc")NP.forEach(n=>n.talk=false);st.panel="";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t==="all"))}
new MutationObserver(()=>{if(sheet.style.display!=="none"&&!(sheet.firstElementChild&&sheet.firstElementChild.classList.contains("xb"))){const b=document.createElement("button");b.className="xb";b.textContent="✕";b.setAttribute("aria-label","關閉");b.onclick=closeSheet;sheet.prepend(b)}}).observe(sheet,{childList:true,attributes:true,attributeFilter:["style"]});
addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
$("#lx").onclick=()=>$("#go").click();
</script>
